name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: jxl_codec.dll
            artifact_path: target/release/jxl_codec.dll
          - os: ubuntu-latest
            artifact_name: libjxl_codec.so
            artifact_path: target/release/libjxl_codec.so
          - os: macos-latest
            artifact_name: libjxl_codec.dylib
            artifact_path: target/release/libjxl_codec.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --release --locked

      - name: Plugin smoke test
        run: cargo run --release --manifest-path tests/Cargo.toml

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxl-codec-${{ runner.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release tag matches Cargo.toml and igplugin.json
        shell: bash
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          manifest_ver=$(jq -r '.version' igplugin.json)
          if [ "${tag_ver}" != "${cargo_ver}" ] || [ "${tag_ver}" != "${manifest_ver}" ]; then
            echo "::error::Version mismatch: tag=${GITHUB_REF_NAME}, Cargo.toml=${cargo_ver}, igplugin.json=${manifest_ver}"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package .igplugin.zip archives
        shell: bash
        run: python3 scripts/package-plugin.py --artifacts-dir artifacts --out-dir dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.igplugin.zip
          generate_release_notes: true
