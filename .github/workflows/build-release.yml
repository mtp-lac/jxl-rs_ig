name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: JxlCodec.dll
            artifact_path: target/release/JxlCodec.dll
          - os: ubuntu-latest
            artifact_name: libjxl_codec.so
            artifact_path: target/release/libjxl_codec.so
          - os: macos-latest
            artifact_name: libjxl_codec.dylib
            artifact_path: target/release/libjxl_codec.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release --locked

      - name: Rename Windows library for ImageGlass
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/jxl_codec.dll target/release/JxlCodec.dll

      - name: Plugin smoke test (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --manifest-path tests/Cargo.toml

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxl-codec-${{ runner.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            igplugin.json
          generate_release_notes: true
