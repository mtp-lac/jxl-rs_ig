name: Nightly

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Branch the nightly is built from. Scheduled runs always use the default
  # branch's workflow file, so this must be selected explicitly below.
  NIGHTLY_BRANCH: nightly

permissions:
  contents: write

jobs:
  build:
    name: Build nightly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: target/release/jxl_codec.dll
          - os: ubuntu-latest
            artifact_path: target/release/libjxl_codec.so
          - os: macos-latest
            artifact_path: target/release/libjxl_codec.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_BRANCH }}

      # A `schedule` event always runs the default branch's copy of this file
      # with GITHUB_REF=refs/heads/<default>. If that happens, the explicit
      # `ref:` above still lands us on NIGHTLY_BRANCH, but a manual dispatch
      # could also be pointed at the wrong branch. Fail loudly either way
      # instead of silently publishing a main build as "nightly".
      - name: Verify we are building the nightly branch
        shell: bash
        run: |
          # Compare full refs: the abbreviated forms are ambiguous when a tag
          # shares the branch's name (`nightly` is also the pre-release tag).
          actual=$(git symbolic-ref HEAD 2>/dev/null || echo "DETACHED")
          expected="refs/heads/${NIGHTLY_BRANCH}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Expected ${expected}, got '${actual}'."
            exit 1
          fi
          echo "Building ${NIGHTLY_BRANCH} at $(git rev-parse --short HEAD)."

      - name: Resolve latest upstream jxl-rs revision
        id: upstream
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/libjxl/jxl-rs.git refs/heads/main | awk '{print $1}')
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Point jxl dependency at latest upstream
        shell: bash
        run: |
          sed "s|^jxl = .*|jxl = { git = \"https://github.com/libjxl/jxl-rs\", rev = \"${{ steps.upstream.outputs.sha }}\" }|" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          grep '^jxl' Cargo.toml
          cargo update -p jxl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build nightly (release)
        run: cargo build --release

      - name: Plugin smoke test (Windows)
        if: runner.os == 'Windows'
        run: cargo run --release --manifest-path tests/Cargo.toml

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-jxl-codec-${{ runner.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish nightly pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_BRANCH }}
          fetch-depth: 0

      # Note: `nightly` is also the name of a pre-release tag. Push the fully
      # qualified ref so git never has to disambiguate branch from tag.
      - name: Move nightly tag to this commit
        run: |
          git tag -f nightly
          git push -f origin refs/tags/nightly:refs/tags/nightly

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          body: |
            Nightly build of the `nightly` branch against the latest upstream `libjxl/jxl-rs` (`main`).
            Pre-release — not intended for production use.
          prerelease: true
          files: |
            artifacts/*
            igplugin.json
