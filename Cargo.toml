[package]
name = "jxl_codec"
version = "1.1.0"
edition = "2021"
authors = ["JXL Codec Developer"]
description = "JPEG XL codec plugin for ImageGlass using jxl-rs"
license = "BSD-3-Clause"

[lib]
name = "jxl_codec"
crate-type = ["cdylib"]

[dependencies]
jxl = "=0.8.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

